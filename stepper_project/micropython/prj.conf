# This file contains selected Kconfig options for the application.

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_COUNTER=y
CONFIG_STEPPER=y
CONFIG_COUNTER_TIMER_STM32=y

# Lets Python look up devices by devicetree node label, e.g. "stepper0".
CONFIG_DEVICE_DT_METADATA=y

# MicroPython runtime
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_POLL=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_CONSOLE_GETCHAR_BUFSIZE=512
CONFIG_CONSOLE_PUTCHAR_BUFSIZE=32
CONFIG_MICROPY_GETCHAR_CONSOLE_SUBSYS=y
CONFIG_LEGACY_GENERATED_INCLUDE_PATH=n

# MicroPython options
CONFIG_MICROPY_CONFIGFILE="mpconfigport.h"
CONFIG_MICROPY_HEAP_SIZE=16384
# units.py needs reverse (__rmul__) and extended (__truediv__) special methods.
CONFIG_MICROPY_CONFIG_ROM_LEVEL_EXTRA_FEATURES=y
CONFIG_MICROPY_FROZEN_MODULES=y
