# This file contains selected Kconfig options for the application.

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_COUNTER=y
CONFIG_STEPPER=y
CONFIG_COUNTER_TIMER_STM32=y
CONFIG_UNITS=y
CONFIG_STD_CPP23=y
CONFIG_CPP=y
# Full libstdc++ instead of Zephyr's minimal C++ library: pc_parser uses
# <expected>, <span> and <algorithm>.
CONFIG_REQUIRES_FULL_LIBCPP=y
# C++ thread wrappers (lib/thread): the app's threads are declared in main.cpp.
CONFIG_RTOS_THREAD=y

CONFIG_NO_OPTIMIZATIONS=y
CONFIG_GRBL_GCODE=y
# The g-code parser needs more than the default 1 KB main stack, especially
# with CONFIG_NO_OPTIMIZATIONS.
CONFIG_MAIN_STACK_SIZE=4096
