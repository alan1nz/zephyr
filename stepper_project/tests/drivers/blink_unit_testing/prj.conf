#
# The unit_testing board builds no kernel/devicetree/driver model at all, so
# this is a pure host binary that talks directly to the driver source (see
# src/main.cpp), faking every kernel/driver dependency it needs.

CONFIG_ZTEST=n

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y

CONFIG_BLINK=y
