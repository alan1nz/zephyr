# SPDX-License-Identifier: Apache-2.0
#
# This is a plain Zephyr application (not a ztest test), so it supplies its
# own main() that runs the Catch2 session instead of ztest's runner.

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

CONFIG_BLINK=y
CONFIG_BLINK_GPIO_LED=y

CONFIG_MAIN_STACK_SIZE=8192
