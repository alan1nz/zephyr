# This file contains selected Kconfig options for the application.

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_COUNTER=y
CONFIG_STEPPER=y
CONFIG_COUNTER_TIMER_STM32=y

CONFIG_RUST=y
# The default 1k main stack isn't large enough for Rust's float formatting.
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_NO_OPTIMIZATIONS=y
